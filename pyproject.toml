[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/reverse_dictionary"]

[project]
name = "reverse-dictionary"
version = "0.1.0"
description = "Reverse dictionary system based on word association norms and graph theory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "nltk>=3.10.4",
    "node2vec>=0.5.0",
    "pandas>=2.3.3",
    "scikit-learn>=1.9.1",
    "spacy>=3.8.18",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "gradio>=6.31.0",
]
